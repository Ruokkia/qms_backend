server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: qms-backend
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/qms?currentSchema=qms
    username: postgres
    password: "123" # NOSONAR
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: qms
    repair-on-migrate: true
    default-schema: qms
    create-schemas: true
    validate-on-migrate: false
    baseline-on-migrate: true
    baseline-version: 20260727161504202
    clean-disabled: true
    out-of-order: false
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 2
        max-wait: 3000ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 生产运行时关闭运行时 SQL 日志，避免日志 I/O 阻塞请求线程。
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      schema: qms
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true

# JWT 配置（双 Token 机制）
jwt:
  # 签名密钥（HS256，至少 256 bit = 32 字节，上线前替换）
  secret: KangliQmsSecretKey2026ForJwtSigningMustBeLongEnough
  # Access Token 有效期（秒）— 2 小时
  access-token-expiration: 7200
  # Refresh Token 有效期（秒）— 7 天
  refresh-token-expiration: 604800
  # Token 签发者
  issuer: kangli-qms

# QMS 业务配置
qms:
  websocket:
    # WebSocket 允许的跨域来源白名单（生产部署时替换/追加为实际前端域名）
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://192.168.165.141:5173

  # M2 异常自动触发调度（从数据库扫描不合格检验记录派生异常单，替代接口同步派生）
  exception:
    auto-trigger:
      # 已废弃：异常单派生改为事件驱动异步实时触发（UnqualifiedInspectionEvent +
      # ExceptionTriggerListener），不再定时轮询扫描。以下配置仅作历史占位，不再生效。
      enabled: false
      # 扫描时间窗口（天）：仅历史遗留字段，当前未使用
      window-days: 30

# 登录安全策略
login:
  # 最大连续失败次数
  max-fail-count: 5
  # 失败计数窗口（秒）— 15 分钟滚动窗口
  fail-window-seconds: 900
  # 锁定时长（秒）— 30 分钟
  lock-duration-seconds: 1800
  # 验证码 TTL（秒）— 5 分钟
  captcha-ttl-seconds: 300

logging:
  level:
    com.kangli.qms: info
